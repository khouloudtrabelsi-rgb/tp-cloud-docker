name: Déploiement automatique

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier index.html
        run: |
          if [ -f index.html ]; then
            echo "✅ index.html trouvé"
            wc -l index.html
          else
            echo "❌ index.html manquant !" && exit 1
          fi

      - name: Déployer
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
